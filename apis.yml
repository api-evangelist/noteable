name: Noteable
description: >-
  Noteable was a collaborative, cloud-based data notebook platform that combined code (SQL, Python,
  and R), natural language, and interactive no-code visualizations so data teams could explore,
  visualize, and act on data together in a single browser-based workspace. It offered real-time
  collaboration and commenting down to individual data points, scheduled/automated notebook runs, and
  connectors to databases and warehouses including Trino, Snowflake, CockroachDB, PostgreSQL, Amazon
  Redshift, Google BigQuery, and Databricks. The company was surfaced as a portfolio company of Wing
  Venture Capital. Noteable was acquired by Confluent on December 1, 2023, and the platform,
  operations, and services were terminated effective immediately, with users given until January 5,
  2024 to export their data. As of this enrichment pass the noteable.io domain no longer serves the
  product and redirects to an Afternic domain-for-sale parking page; app.noteable.io, docs.noteable.io,
  and api.noteable.io are offline. There is no live public API surface to enrich.
